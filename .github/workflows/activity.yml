name: field log

# Redraws assets/activity-log.svg from the GitHub API: daily, on demand, and when the script or this file changes
# (which also draws it the first time the repository is pushed). The push trigger is limited to those paths on
# purpose: the job only ever commits the two activity SVGs, so it can never re-trigger itself.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_activity.py"
      - "scripts/fj.py"
      - ".github/workflows/activity.yml"

permissions:
  contents: write            # the only permission needed: committing the two SVGs

concurrency:
  group: field-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Draw the field log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}     # built in: no secret to create, public data only
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/build_activity.py

      - name: Commit if the log changed
        run: |
          FILES="assets/activity-log.svg assets/activity-log-dark.svg"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then echo "no change"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "log: refresh field log"
          git push
