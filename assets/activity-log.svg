<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="activity-t activity-d"><title id="activity-t">Activity log</title><desc id="activity-d">Activity log window in its static state: an empty chart area marked 'awaiting first sync' beside an index of five public projects. A scheduled action replaces it with real contribution and push data.</desc><style>.s{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif}.m{font-family:'IBM Plex Mono','JetBrains Mono','SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}.a{font-family:'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,'Segoe UI',system-ui,sans-serif}</style><rect width="1000" height="540" fill="#F7F7F4"/><rect x="14" y="14" width="972" height="512" fill="none" stroke="#A7A7A0" stroke-width="1.2"/><rect x="20" y="20" width="960" height="500" fill="none" stroke="#D4D4CF" stroke-width=".8"/><text x="56" y="66" font-size="13" class="m" fill="#555555" letter-spacing="3.2">FIELD LOG</text><text x="944" y="66" font-size="11" class="m" fill="#858585" text-anchor="end" letter-spacing="1.8">STATIC VIEW</text><text x="56" y="108" font-size="31" class="s" fill="#191919">Recent activity</text><text x="56" y="140" font-size="12" class="m" fill="#555555" letter-spacing="2.2">PUBLIC REPOSITORIES · PAST 12 MONTHS</text><line x1="56" y1="160" x2="944" y2="160" stroke="#A7A7A0" stroke-width="0.8" stroke-linecap="butt"/><text x="56" y="196" font-size="11" class="m" fill="#555555" letter-spacing="2.4">THE YEAR, BY MONTH</text><text x="520" y="196" font-size="11" class="m" fill="#555555" letter-spacing="2.4">RECENT PUSHES</text><rect x="64" y="236" width="398" height="136" rx="3" fill="none" stroke="#A7A7A0" stroke-width="1" stroke-dasharray="4 4"/><text x="263" y="300" font-size="12" class="m" fill="#555555" text-anchor="middle" letter-spacing="2.4">AWAITING FIRST SYNC</text><text x="263" y="322" font-size="10" class="m" fill="#858585" text-anchor="middle" letter-spacing="0.6">contribution history appears here</text><line x1="64" y1="372" x2="462" y2="372" stroke="#A7A7A0" stroke-width="1" stroke-linecap="butt"/><line x1="520" y1="212" x2="944" y2="212" stroke="#D4D4CF" stroke-width="0.8" stroke-linecap="butt"/><text x="520" y="238" font-size="12" class="m" fill="#555555">001</text><text x="606" y="234" font-size="13" class="m" fill="#191919">Explainable RL, batch reactor</text><text x="944" y="234" font-size="10" class="m" fill="#858585" text-anchor="end" letter-spacing="0.6">research</text><line x1="520" y1="256" x2="944" y2="256" stroke="#D4D4CF" stroke-width="0.8" stroke-linecap="butt"/><text x="520" y="282" font-size="12" class="m" fill="#555555">002</text><text x="606" y="278" font-size="13" class="m" fill="#191919">Rice leaf disease + RAG</text><text x="944" y="278" font-size="10" class="m" fill="#858585" text-anchor="end" letter-spacing="0.6">vision, RAG</text><line x1="520" y1="300" x2="944" y2="300" stroke="#D4D4CF" stroke-width="0.8" stroke-linecap="butt"/><text x="520" y="326" font-size="12" class="m" fill="#555555">003</text><text x="606" y="322" font-size="13" class="m" fill="#191919">Northstar CRM AI</text><text x="944" y="322" font-size="10" class="m" fill="#858585" text-anchor="end" letter-spacing="0.6">LLM app</text><line x1="520" y1="344" x2="944" y2="344" stroke="#D4D4CF" stroke-width="0.8" stroke-linecap="butt"/><text x="520" y="370" font-size="12" class="m" fill="#555555">004</text><text x="606" y="366" font-size="13" class="m" fill="#191919">Kidney disease prediction</text><text x="944" y="366" font-size="10" class="m" fill="#858585" text-anchor="end" letter-spacing="0.6">ML</text><line x1="520" y1="388" x2="944" y2="388" stroke="#D4D4CF" stroke-width="0.8" stroke-linecap="butt"/><text x="520" y="414" font-size="12" class="m" fill="#555555">005</text><text x="606" y="410" font-size="13" class="m" fill="#191919">E-