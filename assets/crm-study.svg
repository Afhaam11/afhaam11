" letter-spacing="1.4">VALIDATE</text><text x="662" y="299.5" font-size="9.5" class="m" fill="#858585" text-anchor="middle" letter-spacing="0.6">schema check</text><rect x="728" y="256" width="100" height="56" rx="2" fill="#EEEEEA" stroke="#191919" stroke-width="1.3"/><text x="778" y="282.5" font-size="12" class="m" fill="#191919" text-anchor="middle" letter-spacing="1.4">DUCKDB</text><text x="778" y="299.5" font-size="9.5" class="m" fill="#858585" text-anchor="middle" letter-spacing="0.6">SELECT only</text><rect x="844" y="256" width="100" height="56" rx="2" fill="#EEEEEA" stroke="#191919" stroke-width="1.3"/><text x="894" y="282.5" font-size="12" class="m" fill="#191919" text-anchor="middle" letter-spacing="1.4">RECORDS</text><text x="894" y="299.5" font-size="9.5" class="m" fill="#858585" text-anchor="middle" letter-spacing="0.6">rows + SQL</text><path d="M480 284L496 284" fill="none" stroke="#191919" stroke-width="1.3" stroke-linejoin="round"/><path d="M496 284L490 286.5L490 281.5Z" fill="#191919"/><path d="M596 284L612 284" fill="none" stroke="#191919" stroke-width="1.3" stroke-linejoin="round"/><path d="M612 284L606 286.5L606 281.5Z" fill="#191919"/><path d="M712 284L728 284" fill="none" stroke="#191919" stroke-width="1.3" stroke-linejoin="round"/><path d="M728 284L722 286.5L722 281.5Z" fill="#191919"/><path d="M828 284L844 284" fill="none" stroke="#191919" stroke-width="1.3" stroke-linejoin="round"/><path d="M844 284L838 286.5L838 281.5Z" fill="#191919"/><rect x="380" y="430" width="100" height="56" rx="2" fill="#EEEEEA" stroke="#191919" stroke-width="1.3"/><text x="430" y="456.5" font-size="12" class="m" fill="#191919" text-anchor="middle" letter-spacing="1.4">DRAFT</text><text x="430" y="473.5" font-size="9.5" class="m" fill="#858585" text-anchor="middle" letter-spacing="0.6">subject, body</text><rect x="496" y="430" width="100" height="56" rx="2" fill="#EEEEEA" stroke="#191919" stroke-width="1.3"/><text x="546" y="456.5" font-size="12" class="m" fill="#191