<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="crm-t crm-d"><title id="crm-t">Study 003: Northstar CRM AI, an agent for customer spreadsheets</title><desc id="crm-d">Technical diagram beside a drawn customer spreadsheet with a few matching rows marked. Pipeline A, question to records: a plain-English question goes to a language model that returns a JSON query plan, never SQL; the plan is validated against the spreadsheet's columns, parameterized SELECT-only SQL runs on an in-memory DuckDB table, and records come back with the SQL and the plan. Pipeline B, records to campaign: the model drafts a subject and body with placeholders, each recipient's email is previewed, nothing is sent until the user approves, sending goes through SendGrid, and a summary reports what was sent or skipped. An audit trail records uploads, questions and campaign events.</desc><style>.s{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif}.m{font-family:'IBM Plex Mono','JetBrains Mono','SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}.a{font-family:'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,'Segoe UI',system-ui,sans-serif}</style><rect width="1000" height="700" fill="#F7F7F4"/><rect x="14" y="14" width="972" height="672" fill="none" stroke="#A7A7A0" stroke-width="1.2"/><rect x="20" y="20" width="960" height="660" fill="none" stroke="#D4D4CF" stroke-width=".8"/><text x="56" y="66" font-size="13" class="m" fill="#555555" letter-spacing="3.2">STUDY 003</text><text x="944" y="66" font-size="11" class="m" fill="#858585" text-anchor="end" letter-spacing="1.8">FIG. 3 · QUESTION TO CAMPAIGN</text><text x="56" y="108" font-size="31" class="s" fill="#191919">Northstar CRM AI</text><text x="56" y="146" font-size="31" class="s" fill="#191919">an agent for customer spreadsheets</text><text x="56" y="178" font-size="12" class="m