<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="reactor-t reactor-d"><title id="reactor-t">Study 001: explainable reinforcement learning for safe batch reactor control</title><desc id="reactor-d">Technical schematic of a control loop. A jacketed 0.5 litre acrylamide polymerisation batch reactor reports reactor and jacket temperature to an unscented Kalman filter that estimates monomer and initiator concentrations. A PPO policy network reads the estimate and the tracking error against a reference temperature trajectory, and sets coolant flow and heater current. A reward panel feeds the policy and an explainability panel (SHAP, surrogate decision trees, sensitivity heatmaps) reads it. A small schematic shows the task: follow a reference without crossing the maximum allowable temperature.</desc><style>.s{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif}.m{font-family:'IBM Plex Mono','JetBrains Mono','SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}.a{font-family:'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,'Segoe UI',system-ui,sans-serif}</style><rect width="1000" height="700" fill="#202020"/><rect x="14" y="14" width="972" height="672" fill="none" stroke="#66665F" stroke-width="1.2"/><rect x="20" y="20" width="960" height="660" fill="none" stroke="#3C3C39" stroke-width=".8"/><text x="56" y="66" font-size="13" class="m" fill="#BDBDB6" letter-spacing="3.2">STUDY 001</text><text x="944" y="66" font-size="11" class="m" fill="#8C8C86" text-anchor="end" letter-spacing="1.8">FIG. 1 · CONTROL LOOP</text><text x="56" y="108" font-size="31" class="s" fill="#F5F5F1">Explainable reinforcement learning</text><text x="56" y="146" font-size="31" class="s" fill="#F5F5F1">for safe batch reactor control</text><text x="56" y="178" font-size="12" class="m" fill="#BDBDB6" letter-spacing="2.2">PROCESS CONTROL · 